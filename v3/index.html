<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レッツ脳筋</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="レッツ脳筋">
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f3f2ef;
    --border:         #e3e1da;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #86847c;
    --profit:         #2a78d6;
    --loss:           #d03b3b;
    --entry-yellow:   #a37a00;
    --tp-green:       #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #242422;
      --border:         #3a3937;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8a887f;
      --profit:         #3987e5;
      --loss:           #e66767;
      --entry-yellow:   #e0b12c;
      --tp-green:       #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 40px;
    max-width: 640px;
    margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-size: 19px; margin: 0; }
  .updated { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .disclaimer { color: var(--loss); font-weight: 700; font-size: 13px; text-align: center; margin-bottom: 18px; }
  .refresh-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 8px; padding: 6px 12px; font-size: 12px;
  }
  .empty { text-align: center; color: var(--text-muted); padding: 24px 20px; font-size: 13px; line-height: 1.8; }
  .trailing-note { font-size: 11px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
  .push-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; color: var(--text-secondary);
  }
  .push-box textarea {
    width: 100%; height: 70px; margin: 10px 0; font-size: 11px; font-family: monospace;
    background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; resize: vertical;
  }
  .card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card.profit { border-color: var(--profit); background: color-mix(in srgb, var(--profit) 8%, var(--surface-2)); }
  .card.loss { border-color: var(--loss); background: color-mix(in srgb, var(--loss) 8%, var(--surface-2)); }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .card-title .badge { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .card-title .badge.profit { color: var(--profit); }
  .card-title .badge.loss { color: var(--loss); }
  .strategy-tag {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px;
    border-radius: 5px; margin-right: 6px; vertical-align: middle;
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
  }
  .rows { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 12px; }
  .rows.rows-2col { grid-template-columns: 1fr 1fr; row-gap: 10px; }
  .rows-2col .value { white-space: nowrap; font-size: 11px; }
  .rows-2col .value.entry-price { font-size: 12px; }
  .rows.rows-current { margin-bottom: 10px; }
  .rows-current .value { font-size: 18px; }
  .rows.rows-stack { grid-template-columns: 1fr; row-gap: 10px; }
  .rows-stack .value { white-space: nowrap; }
  .rows div { display: flex; flex-direction: column; }
  .value-line { white-space: nowrap; }
  .rows .label { color: var(--text-muted); margin-bottom: 2px; }
  .rows .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .value.profit { color: var(--profit); }
  .value.loss { color: var(--loss); }
  .value.entry-price { color: var(--entry-yellow); }
  .value.tp-green { color: var(--tp-green); }
  .value.sl-red { color: var(--loss); }
  .rows .shares { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  .retracted-banner {
    background: color-mix(in srgb, var(--loss) 10%, var(--surface-1)); border: 1px solid var(--loss); color: var(--loss);
    border-radius: 10px; padding: 10px 14px; font-size: 12px; margin-bottom: 14px;
  }
  section { margin-bottom: 26px; }
  section h2 { font-size: 13px; color: var(--text-secondary); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  section h2 .count { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  section h2 .chart-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .chart-wrap { position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis-label { fill: var(--text-muted); font-size: 10px; }
  .gridline { stroke: var(--border); stroke-width: 1; }
  .equity-line { fill: none; stroke: var(--profit); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .equity-area { fill: var(--profit); opacity: 0.08; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--text-primary); color: var(--surface-1);
    font-size: 11px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; opacity: 0;
    transition: opacity 0.1s; transform: translate(-50%, -130%); z-index: 10;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .modal-box {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px 20px; max-width: 420px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-box h2 { font-size: 16px; margin: 0 0 14px; }
  .modal-box p { font-size: 13px; line-height: 1.9; color: var(--text-secondary); margin: 0 0 18px; }
  .modal-box img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; margin: 0 0 18px; }
  .modal-box .warn { color: var(--loss); font-weight: 700; }
  .modal-ok-btn {
    display: block; width: 100%; background: var(--profit); color: white; border: none;
    border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600;
  }
  #mainContent { display: none; }
</style>
</head>
<body>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2>ご利用にあたって</h2>
      <p>
        ルールは簡単！<br>
        平日10:30・15:00に更新される、上の<b>🆕新着</b>ボードに出てくる銘柄を、株数ではなく<b>金額ベース</b>で指値注文を出すだけ。<br>
        <b>暴落型</b>は利確・損切りとも固定なので、注文したらあとは寝て待て。<br>
        <b>上昇型</b>・<b>相対強さ型</b>は固定の利確ラインがありません。損切りだけ置いて、新高値のたび「📐指値変更」通知の通りに損切りラインを引き上げてください。<br>
        バックテストの結果、1銘柄10万円ずつ買うだけで10年で純利益2788万です。
      </p>
      <img src="backtest-stats.png" alt="バックテスト結果">
      <button class="modal-ok-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <div id="mainContent">
  <header>
    <h1>📈 レッツ脳筋</h1>
    <div style="display:flex; gap:6px;">
      <button class="refresh-btn" id="installBtn" onclick="installApp()" style="display:none;">📲 インストール</button>
      <button class="refresh-btn" id="pushBtn" onclick="setupPush()">🔔 通知設定</button>
      <button class="refresh-btn" onclick="load()">更新</button>
    </div>
  </header>
  <div class="updated" id="updated">読み込み中...</div>
  <div id="pushSetupBox" style="display:none;"></div>
  <div id="installHintBox" style="display:none;"></div>
  <div id="retracted"></div>

  <section>
    <h2>🆕 新着 <span class="count" id="whatsNewCount"></span></h2>
    <div id="whatsNewList"></div>
  </section>

  <section>
    <h2>エントリー中 <span class="count" id="enteredCount"></span></h2>
    <div id="enteredList"></div>
  </section>

  <section>
    <h2>累計損益<span class="chart-subtitle">(1トレード一律10万円投資の場合)</span></h2>
    <div class="chart-wrap">
      <svg id="equityChart" viewBox="0 0 560 180"></svg>
      <div class="tooltip" id="equityTooltip"></div>
    </div>
  </section>

  <section>
    <h2>決済済み <span class="count" id="closedCount"></span></h2>
    <div id="closedList"></div>
  </section>
  </div>

<script>
function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}
</script>
<script>
function fmtYen(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(1) + '%'; }

// VAPID公開鍵(公開して問題ない鍵)。scan.py側の秘密鍵とペア
const VAPID_PUBLIC_KEY = "BBpuh5MMFcaTYTEt6hszhSTY9ODkPRIQ5W1vuhxoNHvO1lH-MLq_06blVKk_Sbfzg3ci5etzNbBoqQQIwXh7eIc";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function setupPush() {
  const box = document.getElementById("pushSetupBox");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    box.style.display = "block";
    box.innerHTML = '<div class="push-box">このブラウザはプッシュ通知に対応していません(iPhoneはホーム画面に追加してから開いてください)。</div>';
    return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") {
      box.style.display = "block";
      box.innerHTML = '<div class="push-box">通知が許可されませんでした。ブラウザの設定から許可してください。</div>';
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if (existing) {
      // 鍵(VAPID_PUBLIC_KEY)が変わっている可能性があるため、古い購読は必ず破棄してから作り直す
      await existing.unsubscribe();
    }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const subJson = JSON.stringify(sub.toJSON());
    box.style.display = "block";
    box.innerHTML = `
      <div class="push-box">
        <b>通知が有効になりました。</b><br>
        あと1手順: 下のテキストをコピーして、GitHubの stock-signal-scanner リポジトリの
        Settings → Secrets and variables → Actions → <code>PUSH_SUBSCRIPTION_JSON</code> に登録してください。<br>
        <b>あなたが最初の1人目</b>なら、コピーした内容を <code>[ ]</code> で囲んで(例: <code>[コピーした内容]</code>)そのまま新規シークレットとして保存。<br>
        <b>2人目以降</b>は、既存のシークレットの配列の中に <code>,</code> 区切りでコピーした内容を追記して保存し直してください(自動では追加されません)。
        <textarea readonly onclick="this.select()">${subJson}</textarea>
        <button class="refresh-btn" onclick="navigator.clipboard.writeText(document.querySelector('#pushSetupBox textarea').value); this.textContent='コピーしました'">コピー</button>
      </div>`;
  } catch (e) {
    box.style.display = "block";
    box.innerHTML = `<div class="push-box">エラー: ${e.message}</div>`;
  }
}

function renderNewsCard(e) {
  const tag = e.strategy_label ? `<span class="strategy-tag">${e.strategy_label}</span>` : '';
  const title = `<span>${tag}${e.name}(${e.code || ''})</span>`;
  let icon = '', cls = '', body = '';
  switch (e.type) {
    case 'new_watching':
      icon = '🆕'; cls = '';
      body = `<div class="rows rows-2col">
        <div><span class="label">指値</span><span class="value entry-price">${fmtYen(e.entry)}</span></div>
        <div><span class="label">損切り</span><span class="value sl-red">${fmtYen(e.sl)}</span></div>
      </div>`;
      break;
    case 'level_up_watching':
      icon = '📐'; cls = '';
      body = `<div class="rows rows-2col">
        <div><span class="label">指値</span><span class="value entry-price">${fmtYen(e.prev_entry)} → ${fmtYen(e.entry)}</span></div>
        <div><span class="label">目標/利確</span><span class="value tp-green">${fmtYen(e.prev_tp)} → ${fmtYen(e.tp)}</span></div>
      </div>`;
      break;
    case 'level_up_entered':
      icon = '📐'; cls = '';
      body = `<div class="rows rows-2col">
        <div><span class="label">損切り</span><span class="value sl-red">${fmtYen(e.prev_sl)} → ${fmtYen(e.sl)}</span></div>
        <div><span class="label">参考:現在の高値</span><span class="value tp-green">${fmtYen(e.tp)}</span></div>
      </div>`;
      break;
    case 'entered':
      icon = '🟦'; cls = '';
      body = `<div class="rows rows-2col">
        <div><span class="label">建値</span><span class="value">${fmtYen(e.entry)}</span></div>
        <div><span class="label">損切り</span><span class="value sl-red">${fmtYen(e.sl)}</span></div>
      </div>`;
      break;
    case 'closed_win':
      icon = '🔵'; cls = 'profit';
      body = `<div class="rows rows-2col">
        <div><span class="label">決済値</span><span class="value profit">${fmtYen(e.exit_price)}</span></div>
        <div><span class="label">損益</span><span class="value profit">${fmtPct(e.pnl_pct)}</span></div>
      </div>`;
      break;
    case 'closed_loss':
      icon = '🔴'; cls = 'loss';
      body = `<div class="rows rows-2col">
        <div><span class="label">決済値</span><span class="value loss">${fmtYen(e.exit_price)}</span></div>
        <div><span class="label">損益</span><span class="value loss">${fmtPct(e.pnl_pct)}</span></div>
      </div>`;
      break;
    case 'retracted':
      icon = '⚠️'; cls = 'loss';
      body = `<div class="empty" style="padding:4px 0;text-align:left;">東証監理・整理銘柄に指定されたため対象外になりました。エントリーは控えてください。</div>`;
      break;
    default:
      return '';
  }
  return `
    <div class="card ${cls}">
      <div class="card-title">
        <span>${icon} ${title}</span>
        <span class="badge">${e.date || ''}</span>
      </div>
      ${body}
    </div>`;
}
function sharesFor100k(entry) { return Math.floor(100000 / entry); }

async function load() {
  document.getElementById('updated').textContent = '更新中...';
  try {
    const res = await fetch('../data.json?t=' + Date.now());
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('updated').textContent = '取得に失敗しました。時間をおいて再試行してください。';
  }
}

function render(data) {
  document.getElementById('updated').textContent = '最終更新: ' + data.updated;

  const retractedEl = document.getElementById('retracted');
  retractedEl.innerHTML = (data.retracted || []).map(r =>
    `<div class="retracted-banner">⚠️ ${r.name}: 東証監理・整理銘柄に指定されたため対象外になりました</div>`
  ).join('');

  // 新着ボード(その日の10:30更新で入れ替え、15:00更新で追加。新しい順はサーバー側で整列済み)
  const whatsNew = data.whats_new || [];
  document.getElementById('whatsNewCount').textContent = whatsNew.length ? `(${whatsNew.length})` : '';
  document.getElementById('whatsNewList').innerHTML = whatsNew.length === 0
    ? '<div class="empty">新着はありません。</div>'
    : whatsNew.map(renderNewsCard).join('');

  // エントリー中(含み損益で色分け: 青=利益, 赤=損失)
  const entered = data.entered || [];
  document.getElementById('enteredCount').textContent = entered.length ? `(${entered.length})` : '';
  document.getElementById('enteredList').innerHTML = entered.length === 0
    ? '<div class="empty">現在、保有中のポジションはありません。</div>'
    : entered.map(c => {
      const cls = c.unrealized_pct >= 0 ? 'profit' : 'loss';
      return `
      <div class="card ${cls}">
        <div class="card-title">
          <span><span class="strategy-tag">${c.strategy_label || ''}</span>${c.name}(${c.code})</span>
          <span class="badge ${cls}">含み損益 ${fmtPct(c.unrealized_pct)}</span>
        </div>
        <div class="rows rows-current">
          <div><span class="label">現在値</span><span class="value ${cls}">${fmtYen(c.last_price)}</span></div>
          <div><span class="label">エントリー日</span><span class="value">${c.entered_date || '-'}</span></div>
        </div>
        <div class="rows rows-2col">
          <div><span class="label">建値</span><span class="value">${fmtYen(c.entry)}</span><span class="shares">10万円で${sharesFor100k(c.entry)}株</span></div>
          ${(c.strategy === 'uptrend' || c.strategy === 'relative_strength')
            ? `<div><span class="label">損切り(トレーリング中)</span><span class="value sl-red">${fmtYen(c.sl)}</span><span class="shares">あと${fmtYen(Math.abs(c.gap_sl_yen))}(${Math.abs(c.gap_sl_pct).toFixed(1)}%)</span></div>`
            : `<div><span class="label">利確まで / 損切りまで</span><span class="value-line"><span class="value tp-green">${fmtYen(Math.abs(c.gap_tp_yen))}(${Math.abs(c.gap_tp_pct).toFixed(1)}%)</span> / <span class="value sl-red">${fmtYen(Math.abs(c.gap_sl_yen))}(${Math.abs(c.gap_sl_pct).toFixed(1)}%)</span></span></div>`
          }
        </div>
        ${(c.strategy === 'uptrend' || c.strategy === 'relative_strength') ? `<div class="trailing-note">参考: 現在の高値 ¥${fmtYen(c.tp)}(固定の利確ラインではありません。新高値のたび損切りラインが切り上がります)</div>` : ''}
      </div>`;
    }).join('');

  // 決済済み(実現損益で色分け)
  const closed = data.closed || [];
  document.getElementById('closedCount').textContent = closed.length ? `(${closed.length})` : '';
  document.getElementById('closedList').innerHTML = closed.length === 0
    ? '<div class="empty">まだ決済済みの銘柄はありません。</div>'
    : closed.map(c => {
      const cls = c.win ? 'profit' : 'loss';
      return `
      <div class="card ${cls}">
        <div class="card-title">
          <span><span class="strategy-tag">${c.strategy_label || ''}</span>${c.name}(${c.code})</span>
          <span class="badge ${cls}">${fmtPct(c.pnl_pct)}</span>
        </div>
        <div class="rows">
          <div><span class="label">建値</span><span class="value">${fmtYen(c.entry)}</span></div>
          <div><span class="label">決済値</span><span class="value ${cls}">${fmtYen(c.exit_price)}</span></div>
          <div><span class="label">決済日</span><span class="value">${c.exit_date || '-'}</span></div>
        </div>
      </div>`;
    }).join('');

  renderChart(data.equity_curve || []);
}

function renderChart(curve) {
  const svg = document.getElementById('equityChart');
  const tooltip = document.getElementById('equityTooltip');
  if (curve.length === 0) {
    svg.innerHTML = '<text class="axis-label" x="280" y="90" text-anchor="middle">まだ決済履歴がありません</text>';
    return;
  }
  const W = 560, H = 180, PAD_L = 56, PAD_R = 10, PAD_T = 10, PAD_B = 22;
  const n = curve.length;
  const values = curve.map(d => d.cum_pnl_yen);
  const minV = Math.min(0, ...values), maxV = Math.max(0, ...values);
  const range = (maxV - minV) || 1;
  const x = i => n === 1 ? (PAD_L + (W - PAD_L - PAD_R) / 2) : PAD_L + (i / (n - 1)) * (W - PAD_L - PAD_R);
  const y = v => H - PAD_B - ((v - minV) / range) * (H - PAD_T - PAD_B);

  const path = 'M ' + curve.map((d, i) => `${x(i).toFixed(1)} ${y(d.cum_pnl_yen).toFixed(1)}`).join(' L ');
  const area = path + ` L ${x(n - 1).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;

  const gridVals = [minV, 0, maxV].filter((v, i, a) => a.indexOf(v) === i);
  const grid = gridVals.map(v => `
    <line class="gridline" x1="${PAD_L}" x2="${W - PAD_R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" />
    <text class="axis-label" x="${PAD_L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmtYen(v)}</text>
  `).join('');

  const step = Math.max(1, Math.floor(n / 5));
  let xlabels = '';
  for (let i = 0; i < n; i += step) {
    xlabels += `<text class="axis-label" x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle">${curve[i].date.slice(5)}</text>`;
  }

  svg.innerHTML = `${grid}<path class="equity-area" d="${area}" /><path class="equity-line" d="${path}" />${xlabels}`;

  svg.onmousemove = (e) => {
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * W;
    let i = Math.round(((px - PAD_L) / (W - PAD_L - PAD_R)) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const d = curve[i];
    tooltip.style.opacity = 1;
    tooltip.style.left = (e.clientX - rect.left) + 'px';
    tooltip.style.top = (e.clientY - rect.top) + 'px';
    tooltip.textContent = `${d.date}  累計${fmtYen(d.cum_pnl_yen)}`;
  };
  svg.onmouseleave = () => { tooltip.style.opacity = 0; };
}

load();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// --- インストール(PWA)関連 ---
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandalone) document.getElementById('installBtn').style.display = '';
});
if (!isStandalone && /iP(hone|ad|od)/.test(navigator.userAgent)) {
  // iOSはbeforeinstallpromptが発火しないため常時ボタンを出す
  document.getElementById('installBtn').style.display = '';
}
async function installApp() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
    return;
  }
  const box = document.getElementById('installHintBox');
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
  box.style.display = '';
  box.innerHTML = `<div class="push-box">` +
    (isIOS
      ? `<p><strong>iPhone/iPad(Safari)</strong>: 画面下の共有アイコン(□に↑)をタップ → 「ホーム画面に追加」を選択</p>`
      : `<p><strong>Android(Chrome)</strong>: 右上の⋮メニュー → 「アプリをインストール」または「ホーム画面に追加」を選択</p>`) +
    `<button class="refresh-btn" onclick="document.getElementById('installHintBox').style.display='none';">閉じる</button></div>`;
}
</script>
</body>
</html>
