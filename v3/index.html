<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JP443</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2a78d6">
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f3f2ef;
    --border:         #e3e1da;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #86847c;
    --profit:         #2a78d6;
    --loss:           #d03b3b;
    --entry-yellow:   #a37a00;
    --tp-green:       #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #242422;
      --border:         #3a3937;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8a887f;
      --profit:         #3987e5;
      --loss:           #e66767;
      --entry-yellow:   #e0b12c;
      --tp-green:       #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 40px;
    max-width: 640px;
    margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-size: 19px; margin: 0; }
  .updated { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .disclaimer { color: var(--loss); font-weight: 700; font-size: 13px; text-align: center; margin-bottom: 18px; }
  .refresh-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 8px; padding: 6px 12px; font-size: 12px;
  }
  .empty { text-align: center; color: var(--text-muted); padding: 24px 20px; font-size: 13px; line-height: 1.8; }
  .push-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; color: var(--text-secondary);
  }
  .card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card.profit { border-color: var(--profit); background: color-mix(in srgb, var(--profit) 8%, var(--surface-2)); }
  .card.loss { border-color: var(--loss); background: color-mix(in srgb, var(--loss) 8%, var(--surface-2)); }
  .card.zone-off { opacity: 0.6; }
  .card.zone-near { border-color: var(--entry-yellow); background: color-mix(in srgb, var(--entry-yellow) 7%, var(--surface-2)); }
  .zone-dots { display: inline-flex; gap: 7px; margin-left: 8px; vertical-align: middle; }
  .zone-dot {
    display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700;
    color: var(--text-muted); opacity: 0.25;
  }
  .zone-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .zone-dot.crash::before { background: var(--loss); }
  .zone-dot.relative_strength::before { background: var(--entry-yellow); }
  .zone-dot.uptrend::before { background: var(--profit); }
  .zone-dot.active { opacity: 1; font-weight: 800; }
  .zone-dot.active.crash { color: var(--loss); }
  .zone-dot.active.relative_strength { color: var(--entry-yellow); }
  .zone-dot.active.uptrend { color: var(--profit); }
  .zone-dot.active::before {
    width: 9px; height: 9px; box-shadow: 0 0 6px currentColor;
    animation: zonePulse 1.3s ease-in-out infinite;
  }
  @keyframes zonePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.25; transform: scale(1.5); }
  }
  .market-status-panel {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.8;
  }
  .market-status-panel .ms-title { font-size: 12px; color: var(--text-muted); font-weight: 700; }
  .market-status-panel .ms-dev { font-size: 20px; font-weight: 800; margin: 2px 0 8px; }
  .market-status-panel .ms-strategies { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
  .market-status-panel .ms-boundary { font-size: 12px; color: var(--text-secondary); }
  .zone-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px; margin-bottom: 8px;
  }
  .zone-badge.on {
    color: var(--tp-green); border: 1px solid var(--tp-green);
    background: color-mix(in srgb, var(--tp-green) 14%, var(--surface-1));
  }
  .zone-badge.near {
    color: var(--entry-yellow); border: 1px solid var(--entry-yellow);
    background: color-mix(in srgb, var(--entry-yellow) 14%, var(--surface-1));
  }
  .zone-badge.off {
    color: var(--text-muted); border: 1px solid var(--border); background: var(--surface-1);
  }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .card-title .badge { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .card-title .badge.profit { color: var(--profit); }
  .card-title .badge.loss { color: var(--loss); }
  .strategy-tag {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px;
    border-radius: 5px; margin-right: 6px; vertical-align: middle;
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
  }
  .strategy-tag.crash {
    color: var(--loss); border-color: var(--loss);
    background: color-mix(in srgb, var(--loss) 14%, var(--surface-1));
    box-shadow: 0 0 5px color-mix(in srgb, var(--loss) 55%, transparent);
  }
  .strategy-tag.uptrend {
    color: var(--profit); border-color: var(--profit);
    background: color-mix(in srgb, var(--profit) 14%, var(--surface-1));
    box-shadow: 0 0 5px color-mix(in srgb, var(--profit) 55%, transparent);
  }
  .strategy-tag.relative_strength {
    color: var(--entry-yellow); border-color: var(--entry-yellow);
    background: color-mix(in srgb, var(--entry-yellow) 14%, var(--surface-1));
    box-shadow: 0 0 5px color-mix(in srgb, var(--entry-yellow) 55%, transparent);
  }
  .rows { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 12px; }
  .rows.rows-2col { grid-template-columns: 1fr 1fr; row-gap: 10px; }
  .rows-2col .value { white-space: nowrap; font-size: 11px; }
  .rows-2col .value.entry-price { font-size: 12px; }
  .rows.rows-current { margin-bottom: 10px; }
  .rows-current .value { font-size: 18px; }
  .rows.rows-stack { grid-template-columns: 1fr; row-gap: 10px; }
  .rows-stack .value { white-space: nowrap; }
  .rows div { display: flex; flex-direction: column; }
  .value-line { white-space: nowrap; }
  .rows .label { color: var(--text-muted); margin-bottom: 2px; }
  .rows .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .value.profit { color: var(--profit); }
  .value.loss { color: var(--loss); }
  .value.entry-price { color: var(--entry-yellow); }
  .value.tp-green { color: var(--tp-green); }
  .value.sl-red { color: var(--loss); }
  .rows .shares { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  .retracted-banner {
    background: color-mix(in srgb, var(--loss) 10%, var(--surface-1)); border: 1px solid var(--loss); color: var(--loss);
    border-radius: 10px; padding: 10px 14px; font-size: 12px; margin-bottom: 14px;
  }
  section { margin-bottom: 26px; }
  section h2 { font-size: 13px; color: var(--text-secondary); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .year-group { margin-bottom: 10px; }
  .year-group summary {
    cursor: pointer; list-style: none; user-select: none;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; font-weight: 700;
  }
  .year-group summary::-webkit-details-marker { display: none; }
  .year-group summary .arrow { transition: transform 0.15s; color: var(--text-muted); font-size: 11px; }
  .year-group[open] summary .arrow { transform: rotate(90deg); }
  .year-group summary .year-total { font-variant-numeric: tabular-nums; }
  .year-group .year-body { padding-top: 10px; }
  section h2 .count { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  section h2 .chart-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .chart-wrap { position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis-label { fill: var(--text-muted); font-size: 10px; }
  .gridline { stroke: var(--border); stroke-width: 1; }
  .equity-line { fill: none; stroke: var(--profit); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .equity-area { fill: var(--profit); opacity: 0.08; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--text-primary); color: var(--surface-1);
    font-size: 11px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; opacity: 0;
    transition: opacity 0.1s; transform: translate(-50%, -130%); z-index: 10;
  }
  #mainContent { display: none; }
  .gate-overlay {
    position: fixed; inset: 0; background: var(--surface-1);
    display: flex; align-items: center; justify-content: center; z-index: 200;
    padding: 20px;
  }
  .gate-box { width: 100%; max-width: 320px; text-align: center; }
  .gate-box h1 { font-size: 18px; margin: 0 0 18px; }
  .gate-box input {
    width: 100%; box-sizing: border-box; background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 15px;
    margin-bottom: 10px; text-align: center;
  }
  .gate-box button {
    width: 100%; background: var(--profit); color: white; border: none;
    border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600;
  }
  .gate-box .gate-error { color: var(--loss); font-size: 12px; margin-top: 8px; min-height: 1.4em; }
</style>
</head>
<body>
  <div class="gate-overlay" id="gateOverlay">
    <div class="gate-box">
      <h1>📈 JP443</h1>
      <input type="password" id="gatePassword" placeholder="パスワード" autocomplete="off">
      <button onclick="checkGatePassword()">開く</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>
  <div id="mainContent">
  <header>
    <h1>📈 JP443 <span class="zone-dots" id="zoneDots"></span></h1>
    <div style="display:flex; gap:6px;">
      <button class="refresh-btn" onclick="load()">更新</button>
    </div>
  </header>
  <div class="updated" id="updated">読み込み中...</div>
  <div id="retracted"></div>
  <div id="marketStatus"></div>

  <section>
    <h2>🆕 新着 <span class="count" id="whatsNewCount"></span></h2>
    <div id="whatsNewList"></div>
  </section>

  <section>
    <h2>📍 現在指値注文中(未保有) <span class="count" id="watchingCount"></span></h2>
    <div id="watchingList"></div>
  </section>

  <section>
    <h2>エントリー中 <span class="count" id="enteredCount"></span></h2>
    <div id="enteredList"></div>
  </section>

  <section>
    <h2>累計損益<span class="chart-subtitle">(spanサイジング: 値幅に応じて7.5万〜12.5万円投資の場合)</span></h2>
    <div class="chart-wrap">
      <svg id="equityChart" viewBox="0 0 560 180"></svg>
      <div class="tooltip" id="equityTooltip"></div>
    </div>
  </section>

  <section>
    <h2>決済済み <span class="count" id="closedCount"></span></h2>
    <div id="closedList"></div>
  </section>
  </div>

<script>
const GATE_PASSWORD_HASH = '7839d9c722cad8b218b270e6ea309726d8bbc39970f4e9f1307ae391575a3e68';
const GATE_STORAGE_KEY = 'gateOk_v1';

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkGatePassword() {
  const input = document.getElementById('gatePassword');
  const hash = await sha256Hex(input.value);
  if (hash === GATE_PASSWORD_HASH) {
    localStorage.setItem(GATE_STORAGE_KEY, '1');
    document.getElementById('gateOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
  } else {
    document.getElementById('gateError').textContent = 'パスワードが違います';
  }
}

document.getElementById('gatePassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkGatePassword();
});

if (localStorage.getItem(GATE_STORAGE_KEY) === '1') {
  document.getElementById('gateOverlay').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}
</script>
<script>
function fmtYen(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function fmtYenSigned(n) { return (n >= 0 ? '+' : '-') + '¥' + Math.round(Math.abs(n)).toLocaleString('ja-JP'); }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(1) + '%'; }

function renderNewsCard(e) {
  const tag = e.strategy_label ? `<span class="strategy-tag ${e.strategy || ''}">${e.strategy_label}</span>` : '';
  const title = `<span>${tag}${e.name}(${e.code || ''})</span>`;
  let icon = '', cls = '', body = '';
  switch (e.type) {
    case 'new_watching':
      icon = '🆕'; cls = '';
      body = `<div class="rows rows-2col">
        <div><span class="label">指値</span><span class="value entry-price">${fmtYen(e.entry)}</span></div>
        <div><span class="label">損切り</span><span class="value sl-red">${fmtYen(e.sl)}</span></div>
      </div>${sizingRows(e)}`;
      break;
    case 'level_up_watching':
      icon = '📐'; cls = '';
      body = `<div class="rows rows-2col">
        <div><span class="label">指値(旧注文は解除)</span><span class="value entry-price">${fmtYen(e.prev_entry)} → ${fmtYen(e.entry)}</span></div>
        <div><span class="label">目標/利確</span><span class="value tp-green">${fmtYen(e.prev_tp)} → ${fmtYen(e.tp)}</span></div>
      </div>`;
      break;
    case 'level_up_entered':
      icon = '📐'; cls = '';
      body = `<div class="rows rows-2col">
        <div><span class="label">損切り</span><span class="value sl-red">${fmtYen(e.prev_sl)} → ${fmtYen(e.sl)}</span></div>
        <div><span class="label">参考:現在の高値</span><span class="value tp-green">${fmtYen(e.tp)}</span></div>
      </div>`;
      break;
    case 'entered':
      icon = '🎯'; cls = '';
      body = `<div class="rows rows-2col">
        <div><span class="label">建値</span><span class="value">${fmtYen(e.entry)}</span></div>
        <div><span class="label">損切り</span><span class="value sl-red">${fmtYen(e.sl)}</span></div>
      </div>${sizingRows(e)}`;
      break;
    case 'closed_win':
      icon = '🔵'; cls = 'profit';
      body = `<div class="rows rows-2col">
        <div><span class="label">決済値</span><span class="value profit">${fmtYen(e.exit_price)}</span></div>
        <div><span class="label">損益(10万円分)</span><span class="value profit">${fmtYenSigned(sharesFor100k(e.entry) * (e.exit_price - e.entry))}</span></div>
      </div>`;
      break;
    case 'closed_loss':
      icon = '🔴'; cls = 'loss';
      body = `<div class="rows rows-2col">
        <div><span class="label">決済値</span><span class="value loss">${fmtYen(e.exit_price)}</span></div>
        <div><span class="label">損益(10万円分)</span><span class="value loss">${fmtYenSigned(sharesFor100k(e.entry) * (e.exit_price - e.entry))}</span></div>
      </div>`;
      break;
    case 'retracted':
      icon = '⚠️'; cls = 'loss';
      body = `<div class="empty" style="padding:4px 0;text-align:left;">東証監理・整理銘柄に指定されたため対象外になりました。エントリーは控えてください。</div>`;
      break;
    case 'expired':
      icon = '⛔'; cls = 'loss';
      body = `<div class="rows rows-2col">
        <div><span class="label">指値</span><span class="value entry-price">${fmtYen(e.entry)}</span></div>
        <div><span class="label">損切りライン</span><span class="value sl-red">${fmtYen(e.sl)}</span></div>
      </div>
      <div class="empty" style="padding:4px 0 0;text-align:left;">損切りラインを割り込み不成立で終了しました。出していた指値注文は解除してください。</div>`;
      break;
    default:
      return '';
  }
  return `
    <div class="card ${cls}">
      <div class="card-title">
        <span>${icon} ${title}</span>
        <span class="badge">${e.date || ''}</span>
      </div>
      ${body}
    </div>`;
}
function sharesFor100k(entry) { return Math.floor(100000 / entry); }

// spanサイジング(2026-08-14採用)の表示用。値は全てscan.py側(recommended_jpy/
// span_size_multiplier)で計算済みのものをそのまま表示するだけで、境界条件の
// 判定ロジックをJS側で重複実装しない(production/Discord/dashboardの完全一致を保証するため)。
function sizingRows(e) {
  if (e.span_pct == null || e.recommended_jpy == null) return '';
  const mult = e.sizing_multiplier != null ? `${e.sizing_multiplier.toFixed(2)}x` : '-';
  return `<div class="rows rows-2col">
        <div><span class="label">値幅</span><span class="value">${(e.span_pct * 100).toFixed(1)}%(${mult})</span></div>
        <div><span class="label">推奨投入額</span><span class="value">${fmtYen(e.recommended_jpy)}${e.recommended_shares != null ? `(${e.recommended_shares}株)` : ''}</span></div>
      </div>`;
}

const STRATEGY_ORDER = ['uptrend', 'relative_strength', 'crash'];
const STRATEGY_ZONE_LABEL = { crash: '暴落', uptrend: '上昇', relative_strength: '相強' };
const STRATEGY_FULL_LABEL = { crash: '暴落型', uptrend: '上昇型', relative_strength: '相対強さ型' };

// 市場状態パネル。dev%・境界距離はscan.py側(export_public_data)で計算済みの
// market_zoneオブジェクトをそのまま表示するだけ(境界判定ロジックをJS側で重複実装しない)。
function renderMarketStatus(mz) {
  if (!mz || mz.dev_pct == null) {
    return '<div class="market-status-panel"><div class="ms-title">市場状態</div><div class="empty" style="padding:8px 0;">取得できませんでした</div></div>';
  }
  const strategies = mz.strategies || {};
  const rows = STRATEGY_ORDER.map(key => {
    const on = !!strategies[key];
    return `<div>${on ? '🟢' : '⚪'} ${STRATEGY_FULL_LABEL[key]} ${on ? 'ON' : 'OFF'}</div>`;
  }).join('');
  const boundaryLine = (mz.next_boundary_pt != null && mz.next_boundary_val != null)
    ? `次の境界 ${mz.next_boundary_val}%まで: ${mz.next_boundary_pt}pt`
    : '';
  const nearNote = (mz.near_0 || mz.near_neg10) ? ' <span style="color:var(--entry-yellow);font-weight:700;">🟡 切替接近</span>' : '';
  return `
    <div class="market-status-panel">
      <div class="ms-title">市場状態</div>
      <div class="ms-dev">200MA乖離: ${fmtPct(mz.dev_pct)}</div>
      <div class="ms-strategies">${rows}</div>
      <div class="ms-boundary">${boundaryLine}${nearNote}</div>
    </div>`;
}

function groupByStrategy(items) {
  return STRATEGY_ORDER
    .concat([...new Set(items.map(x => x.strategy))].filter(k => !STRATEGY_ORDER.includes(k)))
    .map(key => items.filter(x => x.strategy === key))
    .filter(g => g.length > 0);
}

function renderZoneDots(active) {
  return STRATEGY_ORDER.map(key =>
    `<span class="zone-dot ${key}${active === key ? ' active' : ''}">${STRATEGY_ZONE_LABEL[key]}</span>`
  ).join('');
}

function renderEnteredCard(c) {
  const cls = c.unrealized_pct >= 0 ? 'profit' : 'loss';
  return `
      <div class="card ${cls}">
        <div class="card-title">
          <span>${c.name}(${c.code})</span>
          <span class="badge ${cls}">含み損益 ${fmtPct(c.unrealized_pct)}</span>
        </div>
        <div class="rows rows-current">
          <div><span class="label">現在値</span><span class="value ${cls}">${fmtYen(c.last_price)}</span></div>
          <div><span class="label">エントリー日</span><span class="value">${c.entered_date || '-'}</span></div>
        </div>
        <div class="rows rows-2col">
          <div><span class="label">建値</span><span class="value">${fmtYen(c.entry)}</span><span class="shares">推奨¥${Math.round(c.recommended_jpy ?? 100000).toLocaleString('ja-JP')}(${c.span_pct != null ? (c.span_pct*100).toFixed(1)+'%' : '-'})で${c.recommended_shares ?? sharesFor100k(c.entry)}株</span></div>
          ${(c.strategy === 'uptrend' || c.strategy === 'relative_strength')
            ? `<div><span class="label">損切り(トレーリング中)</span><span class="value sl-red">${fmtYen(c.sl)}</span><span class="shares">あと${fmtYen(Math.abs(c.gap_sl_yen))}(${Math.abs(c.gap_sl_pct).toFixed(1)}%)</span></div>`
            : `<div><span class="label">利確まで / 損切りまで</span><span class="value-line"><span class="value tp-green">${fmtYen(Math.abs(c.gap_tp_yen))}(${Math.abs(c.gap_tp_pct).toFixed(1)}%)</span> / <span class="value sl-red">${fmtYen(Math.abs(c.gap_sl_yen))}(${Math.abs(c.gap_sl_pct).toFixed(1)}%)</span></span></div>`
          }
        </div>
      </div>`;
}

function renderWatchingCard(w) {
  // zone_badge/zone_badge_labelはscan.py側(watching_zone_badge)で計算済みの値を
  // そのまま表示するだけ(境界判定ロジックをJS側で重複実装しない)。
  const badge = w.zone_badge || (w.zone_ok !== false ? 'on' : 'off');
  const badgeLabel = w.zone_badge_label || (badge === 'on' ? '🟢 指値対象' : '⚪ 監視のみ・指値解除');
  const cardCls = badge === 'off' ? 'zone-off' : (badge === 'near' ? 'zone-near' : '');
  return `
      <div class="card ${cardCls}">
        <div class="zone-badge ${badge}">${badgeLabel}</div>
        <div class="card-title">
          <span>${w.name}(${w.code})</span>
          <span class="badge">指値まで ${fmtPct(w.gap_pct)}</span>
        </div>
        <div class="rows rows-current">
          <div><span class="label">現在値</span><span class="value">${fmtYen(w.last_price)}</span></div>
          <div><span class="label">指値まで</span><span class="value">${fmtYen(w.gap_yen)}</span></div>
        </div>
        <div class="rows rows-2col">
          <div><span class="label">指値</span><span class="value entry-price">${fmtYen(w.entry)}</span><span class="shares">推奨¥${Math.round(w.recommended_jpy ?? 100000).toLocaleString('ja-JP')}(${w.span_pct != null ? (w.span_pct*100).toFixed(1)+'%' : '-'})で${w.recommended_shares ?? sharesFor100k(w.entry)}株</span></div>
          <div><span class="label">損切り</span><span class="value sl-red">${fmtYen(w.sl)}</span></div>
        </div>
        ${badge === 'off' ? '<div class="empty" style="padding:4px 0 0;text-align:left;">⚠️ 現在この戦略のゾーン対象外です。指値注文は解除を推奨します。</div>' : ''}
      </div>`;
}

async function load() {
  document.getElementById('updated').textContent = '更新中...';
  try {
    const res = await fetch('../data.json?t=' + Date.now());
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('updated').textContent = '取得に失敗しました。時間をおいて再試行してください。';
  }
}

function render(data) {
  document.getElementById('updated').textContent = '最終更新: ' + data.updated;

  document.getElementById('zoneDots').innerHTML = renderZoneDots((data.market_zone || {}).active);
  document.getElementById('marketStatus').innerHTML = renderMarketStatus(data.market_zone);

  const retractedEl = document.getElementById('retracted');
  retractedEl.innerHTML = (data.retracted || []).map(r =>
    `<div class="retracted-banner">⚠️ ${r.name}: 東証監理・整理銘柄に指定されたため対象外になりました</div>`
  ).join('');

  // 新着ボード(その日の10:30更新で入れ替え、15:00更新で追加。新しい順はサーバー側で整列済み)
  const whatsNew = data.whats_new || [];
  document.getElementById('whatsNewCount').textContent = whatsNew.length ? `(${whatsNew.length})` : '';
  document.getElementById('whatsNewList').innerHTML = whatsNew.length === 0
    ? '<div class="empty">新着はありません。</div>'
    : whatsNew.map(renderNewsCard).join('');

  // 現在指値注文中(未保有。戦略ゾーンごとに折りたたみ、各グループ内は指値まで近い順)
  const activeZone = (data.market_zone || {}).active;
  const watching = data.watching || [];
  document.getElementById('watchingCount').textContent = watching.length ? `(${watching.length})` : '';
  const watchingGroups = groupByStrategy(watching)
    .map(items => items.slice().sort((a, b) => a.gap_pct - b.gap_pct));
  document.getElementById('watchingList').innerHTML = watching.length === 0
    ? '<div class="empty">現在、指値待ちのセットアップはありません。</div>'
    : watchingGroups.map(items => {
      const key = items[0].strategy;
      const warnCount = items.filter(w => w.zone_ok === false).length;
      return `
      <details class="year-group">
        <summary>
          <span><span class="arrow">▶</span> <span class="zone-dot ${key}${activeZone === key ? ' active' : ''}"></span> ${items[0].strategy_label}(${items.length}件)</span>
          <span class="year-total value">${warnCount ? `⚠️ ${warnCount}件ゾーン対象外` : ''}</span>
        </summary>
        <div class="year-body">${items.map(renderWatchingCard).join('')}</div>
      </details>`;
    }).join('');

  // エントリー中(戦略ごとに折りたたみ。含み損益で色分け: 青=利益, 赤=損失)
  const entered = data.entered || [];
  document.getElementById('enteredCount').textContent = entered.length ? `(${entered.length})` : '';
  const enteredGroups = groupByStrategy(entered);
  document.getElementById('enteredList').innerHTML = entered.length === 0
    ? '<div class="empty">現在、保有中のポジションはありません。</div>'
    : enteredGroups.map(items => {
      const pnlYen = items.reduce((sum, c) => sum + (c.recommended_shares ?? sharesFor100k(c.entry)) * (c.last_price - c.entry), 0);
      const totalCls = pnlYen >= 0 ? 'profit' : 'loss';
      return `
      <details class="year-group">
        <summary>
          <span><span class="arrow">▶</span> ${items[0].strategy_label}(${items.length}件)</span>
          <span class="year-total value ${totalCls}">${fmtYenSigned(pnlYen)}</span>
        </summary>
        <div class="year-body">${items.map(renderEnteredCard).join('')}</div>
      </details>`;
    }).join('');

  // 決済済み(年ごとにグループ化。見出しはclosed_summaryだけで即表示し、
  // 開いた瞬間にその年の明細(closed/{year}.json)を遅延読み込みする)
  const summary = (data.closed_summary || []).slice().sort((a, b) => b.year.localeCompare(a.year));
  const totalCount = summary.reduce((sum, s) => sum + s.count, 0);
  document.getElementById('closedCount').textContent = totalCount ? `(${totalCount})` : '';
  document.getElementById('closedList').innerHTML = summary.length === 0
    ? '<div class="empty">まだ決済済みの銘柄はありません。</div>'
    : summary.map(s => {
      const totalCls = s.pnl_yen >= 0 ? 'profit' : 'loss';
      return `
      <details class="year-group" data-year="${s.year}">
        <summary>
          <span><span class="arrow">▶</span> ${s.year}年(${s.wins}勝${s.losses}敗)</span>
          <span class="year-total value ${totalCls}">${fmtYenSigned(s.pnl_yen)}</span>
        </summary>
        <div class="year-body"><div class="empty">読み込み中...</div></div>
      </details>`;
    }).join('');

  document.querySelectorAll('#closedList details.year-group').forEach(el => {
    el.addEventListener('toggle', async () => {
      if (!el.open || el.dataset.loaded) return;
      el.dataset.loaded = '1';
      const body = el.querySelector('.year-body');
      try {
        const res = await fetch(`closed/${el.dataset.year}.json?t=` + Date.now());
        const items = await res.json();
        body.innerHTML = items.map(c => {
          const cls = c.win ? 'profit' : 'loss';
          const shares = c.recommended_shares ?? sharesFor100k(c.entry);
          const pnlYen = shares * (c.exit_price - c.entry);
          return `
      <div class="card ${cls}">
        <div class="card-title">
          <span><span class="strategy-tag">${c.strategy_label || ''}</span>${c.name}(${c.code})</span>
          <span class="badge ${cls}">${fmtYenSigned(pnlYen)}</span>
        </div>
        <div class="rows">
          <div><span class="label">建値</span><span class="value">${fmtYen(c.entry)}</span><span class="shares">推奨¥${Math.round(c.recommended_jpy ?? 100000).toLocaleString('ja-JP')}(${c.span_pct != null ? (c.span_pct*100).toFixed(1)+'%' : '-'})で${shares}株</span></div>
          <div><span class="label">決済値</span><span class="value ${cls}">${fmtYen(c.exit_price)}</span></div>
          <div><span class="label">決済日</span><span class="value">${c.exit_date || '-'}</span></div>
        </div>
      </div>`;
        }).join('');
      } catch (e) {
        body.innerHTML = '<div class="empty">読み込みに失敗しました。</div>';
        el.dataset.loaded = '';
      }
    });
  });

  renderChart(data.equity_curve || []);
}

function renderChart(curve) {
  const svg = document.getElementById('equityChart');
  const tooltip = document.getElementById('equityTooltip');
  if (curve.length === 0) {
    svg.innerHTML = '<text class="axis-label" x="280" y="90" text-anchor="middle">まだ決済履歴がありません</text>';
    return;
  }
  const W = 560, H = 180, PAD_L = 56, PAD_R = 10, PAD_T = 10, PAD_B = 22;
  const n = curve.length;
  const values = curve.map(d => d.cum_pnl_yen);
  const minV = Math.min(0, ...values), maxV = Math.max(0, ...values);
  const range = (maxV - minV) || 1;
  const x = i => n === 1 ? (PAD_L + (W - PAD_L - PAD_R) / 2) : PAD_L + (i / (n - 1)) * (W - PAD_L - PAD_R);
  const y = v => H - PAD_B - ((v - minV) / range) * (H - PAD_T - PAD_B);

  const path = 'M ' + curve.map((d, i) => `${x(i).toFixed(1)} ${y(d.cum_pnl_yen).toFixed(1)}`).join(' L ');
  const area = path + ` L ${x(n - 1).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;

  const gridVals = [minV, 0, maxV].filter((v, i, a) => a.indexOf(v) === i);
  const grid = gridVals.map(v => `
    <line class="gridline" x1="${PAD_L}" x2="${W - PAD_R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" />
    <text class="axis-label" x="${PAD_L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmtYen(v)}</text>
  `).join('');

  const step = Math.max(1, Math.floor(n / 5));
  let xlabels = '';
  for (let i = 0; i < n; i += step) {
    xlabels += `<text class="axis-label" x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle">${curve[i].date.slice(5)}</text>`;
  }

  svg.innerHTML = `${grid}<path class="equity-area" d="${area}" /><path class="equity-line" d="${path}" />${xlabels}`;

  svg.onmousemove = (e) => {
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * W;
    let i = Math.round(((px - PAD_L) / (W - PAD_L - PAD_R)) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const d = curve[i];
    tooltip.style.opacity = 1;
    tooltip.style.left = (e.clientX - rect.left) + 'px';
    tooltip.style.top = (e.clientY - rect.top) + 'px';
    tooltip.textContent = `${d.date}  累計${fmtYen(d.cum_pnl_yen)}`;
  };
  svg.onmouseleave = () => { tooltip.style.opacity = 0; };
}

load();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
